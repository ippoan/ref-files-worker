name = "ref-files-worker"
main = "src/index.ts"
compatibility_date = "2024-12-01"
# auth-worker と同じアカウント。
account_id = "24b45709d060d957340180e995f0d373"

[vars]
WORKER_ENV = "prod"
# auth-worker origin — `Authorization: Bearer <mcp jwt>` の `aud` / 公開鍵検証で参照。
AUTH_WORKER_ORIGIN = "https://auth.ippoan.org"
# JWT の `aud` claim。auth-worker `MCP_JWT_AUDIENCE_ALLOWLIST` が mint する
# binary 名 ("ref-files-mcp-server-rs") と一致させる必要がある。URL 形式は
# auth-worker 側が発行しないので strict equal で reject されてしまう
# (Refs ippoan/ref-files-worker#6 smoke 結果)。
MCP_JWT_AUDIENCE = "ref-files-mcp-server-rs"

# ─── Cloudflare Access (人間向け /ui/* surface) ─────────────────────────────
# `/ui/*` は MCP JWT ではなく Cloudflare Access (Zero Trust SSO) で守る。
# `/v1/*` (MCP server 機械アクセス) は従来どおり HS256 JWT のまま — 二重認証を
# 避けるため Access は `/ui/*` path にだけ application を被せる。
#
# Zero Trust dashboard 側の設定 (コード化されない手順):
#   1. Access → Applications → Add → Self-hosted
#   2. Application domain: `ref-files.ippoan.org`  Path: `/ui`
#   3. Policy: 許可する identity (例: Google group / email allowlist)
#   4. 作成後に発行される **Application Audience (AUD) tag** を下の
#      `CF_ACCESS_AUD` に貼る。
#
# `CF_ACCESS_TEAM_DOMAIN` は team の Access ドメイン (`<team>.cloudflareaccess.com`)。
# worker は `https://<team>.cloudflareaccess.com/cdn-cgi/access/certs` の JWKS で
# `Cf-Access-Jwt-Assertion` の RS256 署名を検証する (src/lib/cf-access-jwt.ts)。
CF_ACCESS_TEAM_DOMAIN = "mtamaramu.cloudflareaccess.com"
CF_ACCESS_AUD = "59e8528b8eb834683ab5c95dc767e63bba75f8c667396e92c72138f15e82c305"  # /ui/* Access Application の AUD tag

[observability]
enabled = true
head_sampling_rate = 1

# Custom domain。`wrangler deploy` で DNS record + route が自動生成される。
# `ref-files-staging.ippoan.org` は廃止 (Refs #6) — `ref-files.ippoan.org`
# 1 本立てで staging / prod の区別を持たない単一 env 運用に切替。
[[routes]]
pattern = "ref-files.ippoan.org"
custom_domain = true

# D1: メタデータ (repos / folders / files / revisions)。
[[d1_databases]]
binding = "DB"
database_name = "ref_files"
database_id = "bae2cf6d-3f5c-4c1a-8c58-34ac312107c1"
migrations_dir = "migrations"

# R2: ファイル本体。Key 形式は `files/{repo_id}/{file_id}/{rev_number}`。
[[r2_buckets]]
binding = "BLOBS"
bucket_name = "ref-files-blobs"

# ─── Shared HS256 secret (Secrets Store) ────────────────────────────────────
# `auth-worker` と同じ account-level Secrets Store entry `INTERNAL_SHARED_SECRET`
# を bind し、両 worker が物理的に同一の値を見る。
#
# 2 binding に分けるのは role を意図的に分離するため:
#   - `INTERNAL_SHARED_SECRET` → `/mcp/introspect` Mode 2 (raw shared secret 認証)
#   - `MCP_JWT_SECRET`         → HS256 JWT 署名鍵 (auth-worker mint / verify)
# 値は同一 entry なので drift しない (= rotate も inventory 1 コマンド)。
# 旧 entry `mcp-internal-shared-secret-{prod,staging}` は廃止 (Refs
# ippoan/mcp-relay-rs#21, ippoan/mcp-relay-rs#27 と同じ統合)。
#
# `wrangler secret put MCP_JWT_SECRET` は不要 (Secrets Store binding 経由)。
[[secrets_store_secrets]]
binding = "INTERNAL_SHARED_SECRET"
store_id = "bd7bc91a3e5f4111add4acf6cb4b8733"
secret_name = "INTERNAL_SHARED_SECRET"

[[secrets_store_secrets]]
binding = "MCP_JWT_SECRET"
store_id = "bd7bc91a3e5f4111add4acf6cb4b8733"
secret_name = "INTERNAL_SHARED_SECRET"
