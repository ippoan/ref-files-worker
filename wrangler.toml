name = "ref-files-worker"
main = "src/index.ts"
# 2025-05-01: nodejs_compat_v2 が自動有効化される閾値以降。`agents` SDK
# (durable MCP transport で必要) が `mimetext` → `mime-types` の bare
# `require("path")` を引っ張るため、esbuild に Node built-in として
# resolve させる必要がある (= 旧 2024-12-01 では Deploy で
# "Could not resolve 'path'" となり build fail)。echo-do-ws と同期。
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]
# auth-worker と同じアカウント。
account_id = "24b45709d060d957340180e995f0d373"

[vars]
WORKER_ENV = "prod"
# MCP OAuth authorization server origin。`/mcp` 401 の WWW-Authenticate
# `resource_metadata` がこの origin の per-resource metadata
# (`/.well-known/oauth-protected-resource/ref-files`) を指す。
#
# ippoan の MCP エコシステム (relay = mcp-staging.ippoan.org, connector flow) は
# **staging の auth-worker** で運用されており、prod (auth.ippoan.org) は `v*`
# tag でしか deploy されない。よって MCP_RESOURCE_ORIGINS_ALLOWLIST への
# ref-files 追加 (auth-worker#238) が即時反映されるのは auth-staging 側。
# connector を即つなげるため staging を AS に指す。
AUTH_WORKER_ORIGIN = "https://auth-staging.ippoan.org"
# JWT の `aud` claim 検証ポリシー。`"*"` = aud を問わず、auth-worker が
# 共有 HS256 鍵で mint した token なら受理する (= security-inventory が
# `/mcp/introspect` 委譲で実現しているのと同じ受理挙動を、ローカル検証のまま
# 実現)。理由:
#   - claude.ai connector が mint する `aud` は経路で変わる
#     (RFC 8707 `resource` 送信時は https://ref-files.ippoan.org、
#      非送信時は ecosystem 既定の "github-mcp-server-rs")。固定 aud に pin
#      すると connector token を弾いてしまう。
#   - native `/mcp` は各 tool 呼び出しを内部で `/v1/*` へ再 dispatch するため、
#     introspect 委譲にすると 1 tool call で auth-worker へ 2 往復になる。
#     ローカル検証 + aud 無問のこの方式なら往復ゼロで同じ受理を得る。
#   - identity は `github_login` で確立し、署名 (共有鍵) が auth-worker mint を
#     保証する。confused-deputy は secrets-inventory#43 が既に許容する範囲。
# 特定 aud に絞りたい場合は comma-sep の allowlist
# (例 "ref-files-mcp-server-rs,https://ref-files.ippoan.org") に戻せる。
MCP_JWT_AUDIENCE = "*"

# ─── Cloudflare Access (人間向け /ui/* surface) ─────────────────────────────
# `/ui/*` は MCP JWT ではなく Cloudflare Access (Zero Trust SSO) で守る。
# `/v1/*` (MCP server 機械アクセス) は従来どおり HS256 JWT のまま — 二重認証を
# 避けるため Access は `/ui/*` path にだけ application を被せる。
#
# Zero Trust dashboard 側の設定 (コード化されない手順):
#   1. Access → Applications → Add → Self-hosted
#   2. Application domain: `ref-files.ippoan.org`  Path: `/ui`
#   3. Policy: 許可する identity (例: Google group / email allowlist)
#   4. 作成後に発行される **Application Audience (AUD) tag** を下の
#      `CF_ACCESS_AUD` に貼る。
#
# `CF_ACCESS_TEAM_DOMAIN` は team の Access ドメイン (`<team>.cloudflareaccess.com`)。
# worker は `https://<team>.cloudflareaccess.com/cdn-cgi/access/certs` の JWKS で
# `Cf-Access-Jwt-Assertion` の RS256 署名を検証する (src/lib/cf-access-jwt.ts)。
CF_ACCESS_TEAM_DOMAIN = "mtamaramu.cloudflareaccess.com"
CF_ACCESS_AUD = "59e8528b8eb834683ab5c95dc767e63bba75f8c667396e92c72138f15e82c305"  # /ui/* Access Application の AUD tag

[observability]
enabled = true
head_sampling_rate = 1

# Custom domain。`wrangler deploy` で DNS record + route が自動生成される。
# `ref-files-staging.ippoan.org` は廃止 (Refs #6) — `ref-files.ippoan.org`
# 1 本立てで staging / prod の区別を持たない単一 env 運用に切替。
[[routes]]
pattern = "ref-files.ippoan.org"
custom_domain = true

# D1: メタデータ (repos / folders / files / revisions)。
[[d1_databases]]
binding = "DB"
database_name = "ref_files"
database_id = "bae2cf6d-3f5c-4c1a-8c58-34ac312107c1"
migrations_dir = "migrations"

# R2: ファイル本体。Key 形式は `files/{repo_id}/{file_id}/{rev_number}`。
[[r2_buckets]]
binding = "BLOBS"
bucket_name = "ref-files-blobs"

# ─── Shared HS256 secret (Secrets Store) ────────────────────────────────────
# `auth-worker` と同じ account-level Secrets Store entry `INTERNAL_SHARED_SECRET`
# を bind し、両 worker が物理的に同一の値を見る。
#
# 2 binding に分けるのは role を意図的に分離するため:
#   - `INTERNAL_SHARED_SECRET` → `/mcp/introspect` Mode 2 (raw shared secret 認証)
#   - `MCP_JWT_SECRET`         → HS256 JWT 署名鍵 (auth-worker mint / verify)
# 値は同一 entry なので drift しない (= rotate も inventory 1 コマンド)。
# 旧 entry `mcp-internal-shared-secret-{prod,staging}` は廃止 (Refs
# ippoan/mcp-relay-rs#21, ippoan/mcp-relay-rs#27 と同じ統合)。
#
# `wrangler secret put MCP_JWT_SECRET` は不要 (Secrets Store binding 経由)。
[[secrets_store_secrets]]
binding = "INTERNAL_SHARED_SECRET"
store_id = "bd7bc91a3e5f4111add4acf6cb4b8733"
secret_name = "INTERNAL_SHARED_SECRET"

[[secrets_store_secrets]]
binding = "MCP_JWT_SECRET"
store_id = "bd7bc91a3e5f4111add4acf6cb4b8733"
secret_name = "INTERNAL_SHARED_SECRET"

# ─── Durable Object for `/mcp` (durable MCP transport, Refs #31) ────────────
# `RefFilesMcp` (src/durable.ts) wraps the agents-SDK McpAgent inside a DO
# so the `/mcp` WebSocket survives deploys via reconnect (Gate A) and can
# push `notifications/tools/list_changed` once the client side reads them
# (Gate B — anthropics/claude-code#13646).
#
# The class is registered as a SQLite-backed DO because McpAgent persists
# session state (props, initialize request) in DO SQLite storage.
[[durable_objects.bindings]]
name = "MCP_OBJECT"
class_name = "RefFilesMcp"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RefFilesMcp"]
